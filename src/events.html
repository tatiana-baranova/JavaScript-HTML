<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>Events</title>
</head>
<body>
    <h1 class="heading">
        Events
    </h1>
    <a href="#" class="link" onclick="clickLink()">Click me</a>

    <p class="text" id="mainText" onclick="clickText('#mainText')">
        Some text here
    </p>
    <p class="text" onclick="clickText('a[href]')">
        Some information here
    </p>

    <div class="block">
        Hello
    </div>

    <input type="text" class="input-field" onfocus="focusEvent()" onblur="focusEnd()" onmouseover="focusEvent()" onmouseleave="focusEnd()">

    <textarea id="user-input"></textarea>

    <script src="js/events.js"></script>
</body>
</html>
